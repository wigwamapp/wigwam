name: Release

on:
  push:
    tags:
      - "*"

env:
  RELEASE_ENV: true
  OG_STATIC_CDN: ${{ secrets.OG_STATIC_CDN }}
  OG_INDEXER_API: ${{ secrets.OG_INDEXER_API }}
  OG_INDEXER_API_KEY: ${{ secrets.OG_INDEXER_API_KEY }}
  OG_INFURA_API_KEY: ${{ secrets.OG_INFURA_API_KEY }}
  OG_ANALYTICS_API_KEY: ${{ secrets.OG_ANALYTICS_API_KEY }}
  OG_OPEN_LOGIN_CLIENT_ID: ${{ secrets.OG_OPEN_LOGIN_CLIENT_ID }}
  OG_ON_RAMP_API_KEY: ${{ secrets.OG_ON_RAMP_API_KEY }}
  OG_ON_RAMP_API_URL: ${{ secrets.OG_ON_RAMP_API_URL }}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check TypeScript
        run: yarn ts

      - name: Check ESLint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Create app build
        run: yarn build:chrome & yarn build:firefox

      - name: Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: |
            dist/prod/chrome.zip
            dist/prod/firefox.xpi
