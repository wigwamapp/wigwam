name: New Code

on:
  pull_request:
    branches:
      - main
      - dev

env:
  OG_STATIC_CDN: ${{ secrets.OG_STATIC_CDN }}
  OG_INDEXER_API: ${{ secrets.OG_INDEXER_API }}
  OG_INDEXER_API_KEY: ${{ secrets.OG_INDEXER_API_KEY }}
  OG_INFURA_API_KEY: ${{ secrets.OG_INFURA_API_KEY }}
  OG_ANALYTICS_API_KEY: ${{ secrets.TEST_OG_ANALYTICS_API_KEY }}
  OG_OPEN_LOGIN_CLIENT_ID: ${{ secrets.TEST_OG_OPEN_LOGIN_CLIENT_ID }}
  OG_ON_RAMP_API_KEY: ${{ secrets.OG_ON_RAMP_API_KEY }}
  OG_ON_RAMP_API_URL: ${{ secrets.OG_ON_RAMP_API_URL }}

jobs:
  newcode:
    name: Check the new code before merging and create a build with it
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check TypeScript
        run: yarn ts

      - name: Check ESLint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Create app build
        run: yarn build:chrome

      - uses: gacts/github-slug@v1
        id: slug
        with:
          to-slug: ${{ github.event.pull_request.title }} OG

      - name: Export app build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slug.outputs.slug }}
          path: |
            dist/prod/chrome.zip
          if-no-files-found: error
          retention-days: 21
